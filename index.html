<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Link-in-bio</title>
  <meta name="description" content="I make intuitive &amp; stunning designs perfectly optimized for your product success.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hernán Vionnet | Product Designer — links">
  <meta property="og:description" content="I make intuitive &amp; stunning designs perfectly optimized for your product success.">
  <meta property="og:image" content="/og.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hernán Vionnet | Product Designer — links">
  <meta name="twitter:description" content="I make intuitive &amp; stunning designs perfectly optimized for your product success.">
  <meta name="twitter:image" content="/og.svg">
  <style>
    :root{color-scheme:light;--bg:#f5f4f0;--ink:#171717;--muted:#77746d;--line:rgba(23,23,23,.12);--card:rgba(255,255,255,.72);--accent:#d7f36b;--shadow:0 14px 34px rgba(20,20,20,.07)}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#171816;--ink:#f4f4ed;--muted:#a6a79d;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--accent:#d7f36b;--shadow:0 18px 36px rgba(0,0,0,.18)}}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(215,243,107,.18),transparent 36rem),var(--bg);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}
    main{width:min(100% - 36px,520px);margin:0 auto;padding:58px 0 36px}.profile{text-align:center}.avatar{width:88px;height:88px;margin:0 auto 18px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#171717;font-size:25px;font-weight:800;letter-spacing:-.08em;box-shadow:var(--shadow)}.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}.name{margin:0;font-size:25px;line-height:1.1;font-weight:780;letter-spacing:-.04em}.handle{margin:7px 0 0;color:var(--muted);font-size:14px}.bio{max-width:370px;margin:15px auto 30px;color:var(--muted);font-size:15px}
    .links{display:grid;gap:12px}.link{position:relative;display:flex;align-items:center;justify-content:center;min-height:60px;padding:14px 52px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font-weight:650;text-decoration:none;box-shadow:0 1px 0 rgba(255,255,255,.08) inset;transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}.link:hover,.link:focus-visible{transform:translateY(-2px);border-color:rgba(215,243,107,.7);background:rgba(215,243,107,.16);box-shadow:var(--shadow);outline:none}.emoji{position:absolute;left:19px;font-size:19px}.arrow{position:absolute;right:20px;color:var(--muted);font-size:19px;transition:transform .2s ease}.link:hover .arrow,.link:focus-visible .arrow{transform:translate(3px,-3px);color:var(--ink)}footer{text-align:center;margin-top:34px;color:var(--muted);font-size:12px}footer span{color:var(--accent);font-size:15px;vertical-align:-1px}
    @media(min-width:600px){main{padding-top:82px}}
  </style>
</head>
<body>
  <main>
    <section class="profile" aria-labelledby="name">
      <div class="avatar" id="avatar" aria-hidden="true">MC</div>
      <h1 class="name" id="name">Maya Chen</h1>
      <p class="handle" id="handle">@mayachen</p>
      <p class="bio" id="bio">Designer, maker, and occasional photographer. Building useful things in public.</p>
    </section>
    <nav class="links" id="links" aria-label="Links"></nav>
    <footer>Made with <span>♥️</span> by <a href="/go/portfolio">short.ar/portfolio</a></footer>
  </main>
  <script>
    fetch('/links.json').then(r=>r.json()).then(data=>{document.title=data.name+' — links';document.getElementById('name').textContent=data.name;document.getElementById('handle').textContent=data.handle||'';document.getElementById('bio').textContent=data.bio||'';if(data.avatarImage){document.getElementById('avatar').innerHTML='<img alt="" src="'+data.avatarImage.replace(/"/g,'&quot;')+'">'}else{document.getElementById('avatar').textContent=data.avatar||data.name.split(' ').map(n=>n[0]).join('')}document.getElementById('links').innerHTML=data.links.map(link=>'<a class="link" href="/go/'+encodeURIComponent(link.slug)+'"><span class="emoji">'+(link.emoji||'')+'</span><span>'+link.title+'</span><span class="arrow">↗</span></a>').join('')}).catch(()=>{});
  </script>
</body>
</html>
